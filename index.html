<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Warcraft Defense</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; }
  </style>
</head>
<body>
  <div id="startScreen">
    <button id="startBtn">Start Game</button>
  </div>
  <style>
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #startScreen button {
      font-size: 24px;
      padding: 12px 24px;
    }
  </style>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
