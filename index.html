<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Warcraft Defense</title>
  <style>
    body { margin: 0; background: #111; overflow: hidden; }
  </style>
</head>
<body>
  <div id="startScreen">
    <h1 style="color: white; font-size: 36px; margin-bottom: 20px;">Warcraft Defense</h1>
    <p style="color: white; font-size: 18px; max-width: 600px; text-align: center; margin-bottom: 30px;">
      Defend your castle from waves of invading units. Click to place towers, upgrade them, and watch the battle unfold. Survive as long as you can!
    </p>
    <button id="startBtn" style="font-size: 24px; padding: 12px 24px;">Start Game</button>
  </div>
  <style>
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #startScreen button {
      font-size: 24px;
      padding: 12px 24px;
    }
  </style>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
